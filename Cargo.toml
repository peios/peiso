[package]
name = "peiso"
version = "0.1.0"
edition = "2024"
description = "Builds bootable Peios ISOs from ppk packages"
license = "MIT"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.6", features = ["derive", "wrap_help"] }
peios-skeleton = { git = "https://github.com/peios/peiosutils", rev = "86363e2cd63ddd43f905ae67a66d4d9e5bb2869c" }
ppk = { git = "https://github.com/peios/ppk", rev = "9d86519e410d892236439eee333b28845b28e14d" }
sha2 = "0.10"
tar = "0.4"
tempfile = "3.23"
toml = "0.8"
